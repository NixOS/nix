"$schema": "http://json-schema.org/draft-04/schema"
"$id": "https://nix.dev/manual/nix/latest/protocols/json/schema/build-result-v1.json"
title: Build Result
description: |
  This schema describes the JSON representation of Nix's `BuildResult` type, which represents the result of building a derivation or substituting store paths.

  Build results can represent either successful builds (with built outputs) or various types of failures.

oneOf:
  - "$ref": "#/$defs/success"
  - "$ref": "#/$defs/failure"
type: object
required:
  - success
  - status
properties:
  timesBuilt:
    type: integer
    minimum: 0
    title: Times built
    description: |
      How many times this build was performed.

  startTime:
    type: integer
    minimum: 0
    title: Start time
    description: |
      The start time of the build (or one of the rounds, if it was repeated), as a Unix timestamp.

  stopTime:
    type: integer
    minimum: 0
    title: Stop time
    description: |
      The stop time of the build (or one of the rounds, if it was repeated), as a Unix timestamp.

  cpuUser:
    type: integer
    minimum: 0
    title: User CPU time
    description: |
      User CPU time the build took, in microseconds.

  cpuSystem:
    type: integer
    minimum: 0
    title: System CPU time
    description: |
      System CPU time the build took, in microseconds.

  resourceUsage:
    type: object
    title: Resource Usage
    description: |
      Resource usage of the build. The Linux cgroup of the build measures this usage. Only present when Linux has [`use-cgroups`](@docroot@/command-ref/conf-file.md#conf-use-cgroups) enabled. Each statistic only exists when the kernel provides it. Later versions can add statistics.
    additionalProperties:
      type: integer
      minimum: 0
    properties:
      memoryPeak:
        type: integer
        minimum: 0
        title: Peak Memory
        description: |
          Peak memory usage of the build in bytes, including page cache. Read from `memory.peak`, which needs Linux 5.19 or later.

      memorySwapPeak:
        type: integer
        minimum: 0
        title: Peak of Swap Usage
        description: |
          Peak of swap usage for the build, in bytes. Read from `memory.swap.peak`. Available on Linux 6.5 or later with support for swap. Memory that the kernel moved to swap is no longer in `memoryPeak`. Add both values for the total.

      ioReadBytes:
        type: integer
        minimum: 0
        title: Bytes Read
        description: |
          Number of bytes the build read from block devices (from `io.stat`). Reads from page cache and from tmpfs don't count.

      ioWriteBytes:
        type: integer
        minimum: 0
        title: Bytes Written
        description: |
          Bytes the build wrote to block devices (from `io.stat`). Writes to tmpfs don't count. Buffered writes that reach disk after the build ends don't count either.

      oomKilledProcessCount:
        type: integer
        minimum: 0
        title: Processes Killed by Memory Exhaustion
        description: |
          The number of build processes that the kernel killed because the build ran out of memory (from the `oom_kill` line in `memory.events`)

"$defs":
  success:
    type: object
    title: Successful Build Result
    description: |
      Represents a successful build with built outputs.
    required:
      - success
      - status
      - builtOutputs
    properties:
      success:
        const: true
        title: Success indicator
        description: |
          Always true for successful build results.

      status:
        type: string
        title: Success status
        description: |
          Status string for successful builds.
        enum:
          - "Built"
          - "Substituted"
          - "AlreadyValid"
          - "ResolvesToAlreadyValid"

      builtOutputs:
        type: object
        title: Built outputs
        description: |
          A mapping from output names to their build trace entries.
        additionalProperties:
          "$ref": "build-trace-entry-v3.yaml#/$defs/value"

  failure:
    type: object
    title: Failed Build Result
    description: |
      Represents a failed build with error information.
    required:
      - success
      - status
      - errorMsg
    properties:
      success:
        const: false
        title: Success indicator
        description: |
          Always false for failed build results.

      status:
        type: string
        title: Failure status
        description: |
          Status string for failed builds.
        enum:
          - "PermanentFailure"
          - "InputRejected"
          - "OutputRejected"
          - "TransientFailure"
          - "CachedFailure"
          - "TimedOut"
          - "MiscFailure"
          - "DependencyFailed"
          - "LogLimitExceeded"
          - "NotDeterministic"
          - "NoSubstituters"
          - "HashMismatch"

      errorMsg:
        type: string
        title: Error message
        description: |
          Information about the error if the build failed.

      isNonDeterministic:
        type: boolean
        title: Non-deterministic flag
        description: |
          If timesBuilt > 1, whether some builds did not produce the same result.

          Note that 'isNonDeterministic = false' does not mean the build is deterministic,
          just that we don't have evidence of non-determinism.
