[project]
name = "nix"
revision = "1.0"

[profiles.default]
GITHUB_TOKEN = { description = "GitHub access token", required = false }
GITLAB_TOKEN = { description = "GitLab access token", required = false }
SOURCEHUT_TOKEN = { description = "SourceHut access token", required = false }
NIX_NETRC = { description = "Complete netrc file used by Nix", required = false, as_path = true }
BUILD_TOKEN = { description = "Token exposed to a fixed-output derivation", required = false }

[scopes.nix]
secrets = ["GITHUB_TOKEN", "GITLAB_TOKEN", "SOURCEHUT_TOKEN", "NIX_NETRC", "BUILD_TOKEN"]
